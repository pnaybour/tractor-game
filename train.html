<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toy Train Driver</title>
    <meta
      name="description"
      content="A gentle first-person toy train game with a circular wooden track and simple keyboard or click controls."
    />
    <meta name="theme-color" content="#6ec8ff" />
    <meta property="og:title" content="Toy Train Driver" />
    <meta
      property="og:description"
      content="A toddler-friendly toy train game with a first-person driver view and a top-down track map."
    />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="train-game" aria-label="Toy train driver game">
      <header class="train-topbar">
        <nav class="train-nav" aria-label="Game pages">
          <a href="index.html">Digger</a>
          <a href="train.html" aria-current="page">Train</a>
        </nav>

        <div class="train-title">Toy Train Driver</div>

        <div class="train-speed" aria-label="Train speed">
          <span>Speed</span>
          <strong data-testid="train-speed">0</strong>
        </div>
      </header>

      <section class="train-stage" aria-live="polite">
        <canvas class="driver-canvas" data-testid="driver-canvas" aria-label="First-person train view"></canvas>

        <aside class="track-map" aria-label="Top-down train track view">
          <div class="map-label">Track</div>
          <canvas class="map-canvas" data-testid="map-canvas" aria-hidden="true"></canvas>
        </aside>

        <div class="train-message" data-testid="train-message">Ready</div>
      </section>

      <button class="train-action" type="button" data-testid="train-action" aria-label="Make the train go faster">
        Go
      </button>
    </main>

    <script src="train.js"></script>
  </body>
</html>
